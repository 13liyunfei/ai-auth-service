# ============================================================
# Casbin Model —— RBAC with domains（多租户隔离）
# r = sub(账号), dom(团队/租户), obj(资源), act(动作)
# p = role, dom, obj, act          角色-域-资源-动作 授权
# g = user, role, dom              账号-角色（按域绑定）
# 效果：显式 allow；无匹配即拒绝（fail-closed）
# 菜单权限：菜单本身视为资源 menu:xxx，由同一策略体系判定（前端 v-if 双保险）
# ============================================================

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub, r.dom) && keyMatch2(r.obj, p.obj) && (r.act == p.act || p.act == "*")
