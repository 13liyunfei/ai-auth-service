server:
  port: 8100
  address: 0.0.0.0
  shutdown: graceful

spring:
  application:
    name: ai-auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_auth_service}
    username: ${DB_USERNAME:yunfei}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
  jpa:
    hibernate:
      ddl-auto: validate        # 生产安全：schema 由 Flyway 管理
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: GMT+8

# 调用方凭据：标注平台调用本服务鉴权时，请求头 X-Auth-Key 必须匹配，防止未授权方乱调
adp:
  auth:
    api-key: ${AUTH_API_KEY:dev-internal-key}
    token-ttl-hours: ${AUTH_TOKEN_TTL_HOURS:72}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [traceId=%X{traceId:-N/A}] %-5level %logger{36} - %msg%n"
